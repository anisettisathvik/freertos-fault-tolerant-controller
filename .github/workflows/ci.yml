name: controller-verification
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi qemu-system-arm gdb-multiarch
      - name: Fetch FreeRTOS kernel
        run: |
          git clone --depth 1 --branch V11.1.0 \
            https://github.com/FreeRTOS/FreeRTOS-Kernel.git freertos
      - name: Directed logic tests (ASan + UBSan)
        run: |
          make logic | tee logic.txt
          grep -q "38 passed, 0 failed" logic.txt
      - name: Exhaustive state space exploration
        run: |
          make exhaustive | tee exh.txt
          grep -q "all properties hold" exh.txt
          # every state reachable, no unintended dead ends
          ! grep -q "UNREACHABLE" exh.txt
          ! grep -q "DEAD END" exh.txt
      - name: Coverage must stay at 100% lines
        run: |
          make coverage | tee cov.txt
          grep -q "Lines executed:100.00%" cov.txt
      - name: Static analysis
        run: make analyze
      - name: Build Cortex-M3 firmware
        run: make firmware
      - name: Run under QEMU and check the fault escalation
        run: |
          timeout 60 qemu-system-arm -machine mps2-an385 -cpu cortex-m3 -m 16M \
            -nographic -serial mon:stdio -kernel build/firmware.elf 2>&1 \
            | tr -d '\r' | tee run.txt || true
          grep -q "RUN COMPLETE" run.txt
          grep -q "SAFE       -> LATCHED" run.txt
          grep -q "watchdog expiries .... 2" run.txt
      - name: GDB session against the target
        run: |
          ./tools/gdb_session.sh | tee gdb.txt
          grep -q "ST_FAULT" gdb.txt
